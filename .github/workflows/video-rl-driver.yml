name: Video RL Driver

on:
  push:
    branches: [video-rl-driver]

permissions:
  contents: write

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Configuration Firebase et clé de signature
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$GS" ]; then echo "$GS" | base64 -d > android/driver/google-services.json; fi
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > android/release.jks; fi
      - name: Compilation de RL Driver
        env:
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VERSION_CODE: ${{ github.run_number }}
        run: gradle -p android --no-daemon :driver:assembleRelease
      - name: Outils de la vidéo
        run: pip install pillow
      - name: Accélération de l'émulateur
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Enregistrement sur l'émulateur
        uses: reactivecircus/android-emulator-runner@v2
        env:
          DEMO_DRIVER_LINK: ${{ secrets.DEMO_DRIVER_LINK }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -dns-server 8.8.8.8
          script: bash .github/video/run.sh
      - name: Publication de la vidéo
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out-video || exit 0
          gh release view video-rl-driver >/dev/null 2>&1 || gh release create video-rl-driver --target "$GITHUB_SHA" --prerelease --latest=false --title "Vidéo RL Driver" --notes "Enregistrement de RL Driver sur Android virtuel, mission de test fictive."
          gh release upload video-rl-driver out-video/* --clobber
