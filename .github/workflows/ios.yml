name: iPhone

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      testflight:
        description: "Envoyer cette version sur TestFlight"
        type: boolean
        default: true
      appli:
        description: "Appli à envoyer"
        type: choice
        options: [client, chauffeur]
        default: client

concurrency:
  group: ios-${{ github.ref }}-${{ github.event_name }}-${{ inputs.appli }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compilation (vérification)
    if: ${{ github.event_name == 'push' }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Xcode le plus récent
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|release_candidate|_rc' | sort -V | tail -1)
          sudo xcode-select -s "$XC" && xcodebuild -version
      - name: Projet Xcode
        run: brew install xcodegen && xcodegen generate
      - uses: actions/cache@v4
        with:
          path: ~/spm
          key: spm-${{ hashFiles('project.yml') }}
      - name: Compilation pour le simulateur (sans signature)
        run: |
          ok=1
          for S in RafaiLimousine RLDriver; do
            xcodebuild -project RafaiLimousine.xcodeproj -scheme $S -configuration Debug \
              -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
              -clonedSourcePackagesDirPath ~/spm -skipPackagePluginValidation \
              CODE_SIGNING_ALLOWED=NO build > build-$S.log 2>&1 || true
            echo "== $S"
            grep -E "/(App|Driver)/.*(error|warning):" build-$S.log | sort -u | head -80 || true
            grep -E "error:" build-$S.log | sort -u | head -40 || true
            tail -3 build-$S.log
            grep -q "BUILD SUCCEEDED" build-$S.log || ok=0
          done
          [ $ok = 1 ]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journal-compilation
          path: "build-*.log"

  testflight:
    name: Envoi sur TestFlight (${{ inputs.appli }})
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.testflight }}
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID || '22UZ38MH33' }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID || 'c21c0ed2-11e3-4992-a0b9-72a8b99066f9' }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      TEAM_ID: ${{ vars.APPLE_TEAM_ID || '4B32A333J7' }}
      BUILD_NUMBER: ${{ github.run_number }}
      SCHEME: ${{ inputs.appli == 'chauffeur' && 'RLDriver' || 'RafaiLimousine' }}
    steps:
      - uses: actions/checkout@v4
      - name: Accès Apple présents
        run: |
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 TEAM_ID; do
            if [ -z "${!v}" ]; then echo "::error::Il manque $v dans les réglages du dépôt"; exit 1; fi
          done
      - name: Xcode le plus récent
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|release_candidate|_rc' | sort -V | tail -1)
          sudo xcode-select -s "$XC" && xcodebuild -version
      - name: Projet Xcode
        run: brew install xcodegen && xcodegen generate
      - uses: actions/cache@v4
        with:
          path: ~/spm
          key: spm-${{ hashFiles('project.yml') }}
      - name: Clé App Store Connect
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          KP="$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          echo "KP=$KP" >> "$GITHUB_ENV"
          # remet la clé au bon format (espaces, retours à la ligne perdus au copier-coller) ; n'affiche que des longueurs
          KP="$KP" python3 - <<'PY'
          import os, re, textwrap
          s = os.environ.get('ASC_KEY_P8', '').replace('\r', '')
          m = re.search(r'-----BEGIN PRIVATE KEY-----(.*?)-----END PRIVATE KEY-----', s, re.S)
          body = re.sub(r'[^A-Za-z0-9+/=]', '', m.group(1) if m else s)
          open(os.environ['KP'], 'w').write('-----BEGIN PRIVATE KEY-----\n' + '\n'.join(textwrap.wrap(body, 64)) + '\n-----END PRIVATE KEY-----\n')
          print('Contrôle de la clé : debut=%s fin=%s lignes=%d caracteres=%d corps=%d' % ('BEGIN PRIVATE KEY' in s, 'END PRIVATE KEY' in s, s.count('\n') + 1, len(s), len(body)))
          if not (150 <= len(body) <= 260):
              print('::error::Le secret ASC_KEY_P8 ne ressemble pas au contenu du fichier AuthKey_.p8 (corps de %d caractères au lieu d\'environ 200).' % len(body))
              raise SystemExit(1)
          PY
      - name: Archive, signature et envoi à Apple
        run: |
          set -o pipefail
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KP" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          COMMON=(-project RafaiLimousine.xcodeproj -scheme "$SCHEME" -configuration Release -destination 'generic/platform=iOS'
                  -clonedSourcePackagesDirPath "$HOME/spm" -skipPackagePluginValidation)
          export_upload() {
            xcodebuild -exportArchive -archivePath "$1" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
              -exportPath "$RUNNER_TEMP/out" "${AUTH[@]}" > "export-$2.log" 2>&1
          }
          # 1) archive signée « localement », puis signature de distribution gérée par Apple au moment de l'envoi
          if xcodebuild "${COMMON[@]}" -archivePath "$RUNNER_TEMP/A.xcarchive" \
               DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- AD_HOC_CODE_SIGNING_ALLOWED=YES \
               PROVISIONING_PROFILE_SPECIFIER= CURRENT_PROJECT_VERSION="$BUILD_NUMBER" archive > archive-a.log 2>&1 \
             && export_upload "$RUNNER_TEMP/A.xcarchive" a; then
            echo "Envoyé à Apple (méthode 1) : $SCHEME, version $BUILD_NUMBER"; exit 0
          fi
          echo "::warning::Méthode 1 impossible, essai de la signature automatique complète"
          tail -30 archive-a.log; tail -30 export-a.log 2>/dev/null || true
          # 2) signature automatique complète avec la clé App Store Connect
          xcodebuild "${COMMON[@]}" -archivePath "$RUNNER_TEMP/B.xcarchive" "${AUTH[@]}" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION="$BUILD_NUMBER" archive > archive-b.log 2>&1 \
            || { grep -E "error:" archive-b.log | sort -u | head -30; tail -30 archive-b.log; exit 1; }
          export_upload "$RUNNER_TEMP/B.xcarchive" b || { tail -40 export-b.log; exit 1; }
          echo "Envoyé à Apple (méthode 2) : $SCHEME, version $BUILD_NUMBER"
      - name: Effacer la clé
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journaux-testflight
          path: "*.log"
