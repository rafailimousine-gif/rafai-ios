name: App Store (validation)

on:
  workflow_dispatch:
    inputs:
      appli:
        description: "Appli"
        type: choice
        options: [client, chauffeur]
      version:
        description: "Version (ex. 1.1)"
        required: true
      build:
        description: "Numéro de build TestFlight"
        required: true
      notes_fr:
        description: "Nouveautés (français)"
        required: true
      notes_en:
        description: "What's new (English)"
        required: true
      soumettre:
        description: "Soumettre à Apple (sinon : préparer seulement)"
        type: boolean
        default: false

jobs:
  envoi:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID || '22UZ38MH33' }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID || 'c21c0ed2-11e3-4992-a0b9-72a8b99066f9' }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      BUNDLE: ${{ inputs.appli == 'chauffeur' && 'com.rafailimousine.driver' || 'com.rafailimousine.client' }}
      VERSION: ${{ inputs.version }}
      BUILD: ${{ inputs.build }}
      NOTES_FR: ${{ inputs.notes_fr }}
      NOTES_EN: ${{ inputs.notes_en }}
      SUBMIT: ${{ inputs.soumettre && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pyjwt cryptography
      - run: python3 appstore/asc_submit.py
