name: Android

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      publier:
        description: "Publier les fichiers d'installation (lien direct RL Driver)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Compilation Android (Rafai Limousine + RL Driver)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Configuration Firebase et clé de signature (secrets du dépôt)
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$GS" ]; then echo "$GS" | base64 -d > android/driver/google-services.json && echo "Firebase : ok"; else echo "::warning::GOOGLE_SERVICES_JSON absent : RL Driver sans notifications"; fi
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > android/release.jks && echo "Clé de signature : ok"; else echo "::warning::ANDROID_KEYSTORE_B64 absent : fichiers signés avec une clé de test"; fi

      - name: Compilation
        env:
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VERSION_CODE: ${{ github.run_number }}
        run: gradle -p android --no-daemon --stacktrace :driver:assembleRelease :driver:bundleRelease :client:assembleRelease :client:bundleRelease

      - name: Fichiers d'installation
        run: |
          mkdir -p out
          cp android/driver/build/outputs/apk/release/driver-release.apk out/RL-Driver.apk
          cp android/client/build/outputs/apk/release/client-release.apk out/Rafai-Limousine.apk
          cp android/client/build/outputs/bundle/release/client-release.aab out/Rafai-Limousine.aab
          cp android/driver/build/outputs/bundle/release/driver-release.aab out/RL-Driver.aab
          ls -la out
          if [ -f android/release.jks ]; then
            keytool -list -v -keystore android/release.jks -storepass "$ANDROID_KEY_PASS" -alias "${ANDROID_KEY_ALIAS:-rafai}" | grep -E "SHA256:" | head -1 | sed 's/^.*SHA256: /Empreinte SHA-256 de la clé : /'
          fi
        env:
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ github.run_number }}
          path: out/
          retention-days: 30

      - name: Fichier Google Play (pré-version, jamais « latest »)
        if: ${{ hashFiles('android/release.jks') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "play-${{ github.run_number }}" out/Rafai-Limousine.aab out/RL-Driver.aab --prerelease --latest=false \
            --title "Google Play ${{ github.run_number }}" \
            --notes "Rafai Limousine et RL Driver pour Google Play (version ${{ github.run_number }}), fichiers .aab à importer dans la Play Console."
          echo "Fichier Play : https://github.com/${{ github.repository }}/releases/download/play-${{ github.run_number }}/Rafai-Limousine.aab"

      - name: Lien d'installation (GitHub Releases)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publier && hashFiles('android/release.jks') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-${{ github.run_number }}" out/RL-Driver.apk out/Rafai-Limousine.apk \
            --title "Android ${{ github.run_number }}" \
            --notes "RL Driver et Rafai Limousine pour Android (version ${{ github.run_number }})." --latest
          echo "Lien RL Driver : https://github.com/${{ github.repository }}/releases/latest/download/RL-Driver.apk"
