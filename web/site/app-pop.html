<div id="rlApp" class="rla" role="dialog" aria-modal="true" aria-labelledby="rlaT" hidden>

      <span class="rla-bd rla-gp"><img src="https://play.google.com/intl/en_us/badges/static/images/badges/en_badge_web_generic.png" alt="Get it on Google Play"></span>

    <div class="rla-cs">Coming soon on iPhone &amp; Android</div>

    <div class="rla-ft">Paris · Airports · Events · 24/7</div>
  </div>
</div>
<style>
.rla{position:fixed;inset:0;z-index:2147483000;display:flex;justify-content:center;align-items:flex-start;padding:28px 16px;box-sizing:border-box;background:rgba(8,8,9,.74);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);overflow:auto;opacity:0;transition:opacity .35s ease}
.rla[hidden]{display:none}
.rla.on{opacity:1}
.rla-card{position:relative;width:100%;max-width:420px;box-sizing:border-box;padding:40px 24px 24px;border-radius:24px;text-align:center;color:#F5F1E8;background:radial-gradient(120% 80% at 50% 0%,#2A2418 0%,#121212 55%,#0B0B0C 100%);border:1px solid rgba(201,164,92,.35);box-shadow:0 30px 80px rgba(0,0,0,.55);transform:translateY(14px) scale(.97);transition:transform .45s cubic-bezier(.2,.8,.2,1);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.rla.on .rla-card{transform:none}
.rla-x{position:absolute;top:12px;right:12px;width:40px;height:40px;padding:0;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
.rla-x:hover{background:rgba(255,255,255,.16)}
.rla-ic{display:block;margin:0 auto 18px;width:104px;height:104px;border-radius:24px;box-shadow:0 12px 30px rgba(0,0,0,.5),0 0 0 1px rgba(201,164,92,.45);animation:rlaF 3.2s ease-in-out infinite}
@keyframes rlaF{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.rla-eb{display:inline-block;padding:5px 12px;border-radius:999px;background:linear-gradient(90deg,#E7C27A,#B8893B);color:#1A1408;font-size:11.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.rla h2{margin:14px 0 8px;font-size:26px;line-height:1.15;font-weight:800;letter-spacing:-.01em;color:#fff}
.rla p{margin:0 auto 20px;max-width:330px;font-size:14.5px;line-height:1.5;color:rgba(245,241,232,.8)}
.rla-st{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.rla-bd{display:inline-block;height:46px;line-height:0}
.rla-bd img{display:block;height:46px;width:auto}
.rla-gp{width:160px;overflow:hidden;border-radius:9px}
.rla-gp img{height:72px;width:186px;max-width:none;margin:-13px 0 0 -13px}
.rla-cs{margin:0 0 20px;font-size:12.5px;font-weight:700;letter-spacing:.06em;color:#E7C27A}
.rla-go{width:100%;padding:14px 18px;border:0;border-radius:14px;background:linear-gradient(90deg,#E7C27A,#C79A4A);color:#16110A;font-size:15.5px;font-weight:800;cursor:pointer;box-shadow:0 10px 24px rgba(201,164,92,.25);font-family:inherit}
.rla-go:hover{filter:brightness(1.05)}
.rla-ft{margin-top:12px;font-size:12px;color:rgba(245,241,232,.55);letter-spacing:.04em}
@media (prefers-reduced-motion:reduce){.rla,.rla-card{transition:none}.rla-ic{animation:none}}
</style>
<script>
(function () {
  if (window.__rlApp) return; window.__rlApp = 1;
  var K = 'rl_app_pop_v1', p = document.getElementById('rlApp'); if (!p) return;
  try { if (sessionStorage.getItem(K)) return; } catch (e) {}
  function esc(e) { if (e.key === 'Escape') close(); }
  function close() {
    p.classList.remove('on'); setTimeout(function () { p.hidden = true; }, 350);
    try { sessionStorage.setItem(K, '1'); } catch (e) {}
    document.removeEventListener('keydown', esc);
  }
  setTimeout(function () { p.hidden = false; requestAnimationFrame(function () { p.classList.add('on'); }); }, 600);
  document.getElementById('rlaX').addEventListener('click', close);
  document.getElementById('rlaGo').addEventListener('click', close);
  p.addEventListener('click', function (e) { if (e.target === p) close(); });
  document.addEventListener('keydown', esc);
})();
</script>
