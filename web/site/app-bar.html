
<!-- ---- Appli Rafai Limousine : petit bandeau à l'arrivée sur le site (une fois par visite).
     iPhone et iPad uniquement pour l'instant. Pour Android : mettre l'adresse Google Play dans PL une fois l'appli validée. ---- -->
<div id="rlBar" class="rlb" hidden>
  <img src="https://booking.rafai-limousine.com/icon-192.png" alt="" width="20" height="20">
  <span class="rlb-t" id="rlbT"></span>
  <a id="rlbO" target="_blank" rel="noopener"></a>
  <button type="button" id="rlbS"></button>
</div>
<style>
.rlb{position:fixed;top:0;left:0;right:0;z-index:2147483000;display:flex;align-items:center;gap:7px;padding:4px 8px;box-sizing:border-box;background:#0B0B0C;border-bottom:1px solid rgba(201,164,92,.45);color:#F5F1E8;font:600 10.5px/1.25 Manrope,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;transform:translateY(-100%);transition:transform .3s ease}
.rlb[hidden]{display:none}
.rlb.on{transform:none}
.rlb img{flex:none;width:20px;height:20px;border-radius:5px}
.rlb-t{flex:1;min-width:0}
.rlb a{flex:none;padding:3px 9px;border-radius:999px;background:#C79A4A;color:#16110A;font-weight:800;text-decoration:none}
.rlb button{flex:none;padding:3px 0;border:0;background:none;color:rgba(245,241,232,.72);font:inherit;text-decoration:underline;cursor:pointer}
@media (max-width:340px){.rlb img{display:none}}
@media (prefers-reduced-motion:reduce){.rlb{transition:none}}
/* Bloc plus large que haut : le contenu défile dans la carte, surtout sur téléphone (page Home seulement) */
.page>.card{flex:0 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
@media (max-height:500px){.page>.photo{display:none}.page>.card{margin-top:0;border-radius:18px;flex:1 1 auto}}
</style>
<script>
(function () {
  if (window.__rlBar) return; window.__rlBar = 1;
  var AS = 'https://apps.apple.com/fr/app/rafai-limousine/id6829341896', PL = '';
  var K = 'rl_app_bar_v1', p = document.getElementById('rlBar'); if (!p) return;
  var ua = navigator.userAgent || '';
  var ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var url = ios ? AS : (/Android/.test(ua) ? PL : '');
  if (!url) return;
  try { if (sessionStorage.getItem(K)) return; } catch (e) {}
  var TX = {
    fr: ['Continuer sur l’application Rafai Limousine', 'Ouvrir', 'Rester sur le site'],
    en: ['Continue in the Rafai Limousine app', 'Open', 'Stay on the website'],
    zh: ['在 Rafai Limousine 应用中继续', '打开', '留在网站'],
    ar: ['تابع في تطبيق Rafai Limousine', 'فتح', 'البقاء على الموقع']
  };
  var g = String(navigator.language || 'en').slice(0, 2).toLowerCase(), T = TX[g] || TX.en;
  p.dir = g === 'ar' ? 'rtl' : 'ltr';
  document.getElementById('rlbT').textContent = T[0];
  var o = document.getElementById('rlbO'), s = document.getElementById('rlbS');
  o.textContent = T[1]; o.href = url; s.textContent = T[2];
  function close() {
    p.classList.remove('on'); setTimeout(function () { p.hidden = true; }, 320);
    try { sessionStorage.setItem(K, '1'); } catch (e) {}
  }
  o.addEventListener('click', close);
  s.addEventListener('click', close);
  setTimeout(function () { p.hidden = false; requestAnimationFrame(function () { p.classList.add('on'); }); }, 500);
})();
</script>
